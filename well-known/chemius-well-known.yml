  "app.chemius.net / app.allchemist.net is temporarily..." for every path, so
  the apex is not a distinct discovery surface — it fronts the same
  application estate (BENS Consulting also operates the Allchemist brand).
  www.chemius.net is WordPress and returns its themed 404 page. my.chemius.net
  and app.chemius.net return Apache 404s at /.well-known/* while returning a
  200 SPA shell at ordinary paths, so the SPA catch-all does NOT extend to
  /.well-known/ — these 404s are real, not soft.
