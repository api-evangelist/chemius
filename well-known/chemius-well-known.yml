  apex (chemius.net), the application host (my.chemius.net) and the sign-in
  host (app.chemius.net). No well-known document is served on any host. No
  WellKnown or SecurityTxt pointer is wired in apis.yml, because a recorded
  absence is not a presence.
note: >-
