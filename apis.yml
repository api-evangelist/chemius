aid: chemius
name: Chemius
kind: company
description: >-
  Chemius is a cloud-based chemical compliance platform that automates Safety
  Data Sheet (SDS), Technical Data Sheet (TDS), and regulatory label creation
  in 38+ languages for organizations handling chemical products. The platform
  exposes an API suite covering SDS, TDS, ADR transport documentation, ERP
  integration, labels, web shop product data, and PDF generation, and offers
  AI-assisted authoring through the Chemius AI SDS assistant. Chemius is
  hosted in a data center the company describes as DIN ISO/IEC 27001-certified,
  and ships the EU CLP 1272/2008 regulatory region alongside REACH 1907/2006,
  detergents, aerosols, ADR and UFI/PCN support. US OSHA and a general GHS
  region are announced on the site as "Coming Soon" rather than shipped. Chemius
  sells seven named APIs as separately priced monthly add-ons but publishes no
  reference for any of them: every API page ends at "Book a call & ask for the
  API documentation".
