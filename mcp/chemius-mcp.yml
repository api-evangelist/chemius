blocking_gap: >-
  A Chemius MCP server is not buildable from public information today. There is no published
  contract, no documented authentication, no base URL and no parameter names — the reference is
  handed over only after a sales call. The candidate tools below carry no inputSchema for exactly
  that reason: inventing one would be fabricating the parameters of a commercial API.
tools:
  - name: get_safety_data_sheet
    api: chemius:sds-api
    description: >-
      Retrieve a specific SDS as a Chemius permalink for a product, for embedding in an ERP or CRM
      record.
    inputSchema: null
    source: https://www.chemius.net/api/
  - name: list_safety_data_sheets
    api: chemius:sds-api
    description: Retrieve a list of SDS permalinks based on criteria.
    inputSchema: null
    source: https://www.chemius.net/api/
  - name: list_changed_safety_data_sheets
    api: chemius:sds-api
    description: >-
      Identify which products have had SDS changes — the daily poll an ERP runs to drive customer
      re-notification.
    inputSchema: null
    source: https://www.chemius.net/safety-data-sheet-api/
  - name: get_clp_classification
    api: chemius:web-shop-api
    description: >-
      Retrieve hazard statements, precautionary statements, hazard pictograms and the signal word
      for a product, for a web shop or downstream system.
    inputSchema: null
    source: https://www.chemius.net/api/
  - name: get_technical_data_sheet_section
    api: chemius:tds-api
    description: >-
      Retrieve a TDS section by purpose (description, instructions, ...) in a requested language,
      returning section layout, formatted content and the Chemius style.
    inputSchema: null
    source: https://www.chemius.net/technical-data-sheet-api-tds-api/
  - name: generate_adr_transport_document
    api: chemius:adr-api
    description: >-
      Submit a product list with quantities, calculate ADR points and return a compliant transport
      document as PDF.
    inputSchema: null
    consequential: true
    source: https://www.chemius.net/adr-api/
  - name: get_label_content
    api: chemius:label-api
    description: >-
      Retrieve structured, multilingual labelling information for delivery to labelling software or
      an ERP.
    inputSchema: null
    source: https://www.chemius.net/label-api/
  - name: sync_erp_product_data
    api: chemius:erp-api
    description: >-
      Retrieve hazard information (H and P phrases, pictograms), physical and chemical properties
      and transport data (UN numbers, labels, classes) for synchronisation into an ERP.
    inputSchema: null
    source: https://www.chemius.net/erp-api/
  - name: get_document_pdf
    api: chemius:pdf-api
    description: >-
      Generate or retrieve the current PDF rendering of an SDS, TDS or Safety Instruction.
    inputSchema: null
    source: https://www.chemius.net/pdf-api/
tool_count: 9
tools_with_schema: 0
