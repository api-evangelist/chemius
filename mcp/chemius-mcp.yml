specification: API Commons MCP
specificationVersion: '0.1'
provider: Chemius
providerId: chemius
generated: '2026-09-05'
method: derived
status: candidate
source: >-
  Derived from capability prose on https://www.chemius.net/api/ and the seven per-API pages. No
  OpenAPI exists to derive operations from, so every tool below is a capability name taken from the
  provider's own description of what each API does — not an operationId, and not a contract.
description: >-
  Chemius ships NO Model Context Protocol server. This manifest is a candidate: a sketch of what an
  MCP server over the seven Chemius APIs would expose, recorded so the absence is countable and so
  the shape is on file if Chemius ever publishes one. It must never be read as an agent surface
  that exists.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: derived
  note: >-
    No hosted MCP endpoint and no stdio package. Searched npm, PyPI, RubyGems, crates.io and GitHub
    for a Chemius MCP server on 2026-09-05: zero results. No /.well-known/ discovery document is
    served on any Chemius host. There is nothing for an MCP client to POST to and nothing for a
    human to install.
